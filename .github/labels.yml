# Standard label taxonomy for this repo.
# Applied automatically by .github/workflows/labels.yml on every push to main.
- name: "bug"
  color: "d73a4a"
  description: "Something isn't working"

- name: "enhancement"
  color: "a2eeef"
  description: "New feature or request"

- name: "documentation"
  color: "0075ca"
  description: "Improvements or additions to documentation"

- name: "security"
  color: "b60205"
  description: "Security-related issue or fix"

- name: "dependencies"
  color: "0366d6"
  description: "Dependency updates (Dependabot)"

- name: "ci"
  color: "fbca04"
  description: "Continuous integration / GitHub Actions"

- name: "good first issue"
  color: "7057ff"
  description: "Good for newcomers"

- name: "help wanted"
  color: "008672"
  description: "Extra attention is needed"

- name: "question"
  color: "d876e3"
  description: "Further information is requested"

- name: "wontfix"
  color: "ffffff"
  description: "This will not be worked on"

- name: "breaking-change"
  color: "e11d21"
  description: "Introduces a breaking API change"

- name: "webhooks"
  color: "c5def5"
  description: "Related to Snippe webhook handling"

- name: "payments"
  color: "5319e7"
  description: "Related to payment creation/flow"

- name: "payouts"
  color: "1d76db"
  description: "Related to payout creation/flow"
